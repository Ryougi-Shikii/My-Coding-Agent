[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: needs real Docker and/or a real LLM API key (run with --integration)
    docker: needs a running Docker daemon
    llm: calls the real LLM API (costs a little money / quota)
    slow: slow test (e.g. builds a Docker image)
